# Yaver Docker imajı: her push/PR'da derlenir, main'de ghcr.io'ya gönderilir.
# Sürüm kök dizindeki VERSION dosyasından okunur. Yeni sürüm çıkarmak = VERSION'ı artırıp main'e push.
#   ghcr.io/<owner>/yaver:0.3.0       ← VERSION (bu sürüm ilk kez yayınlanıyorsa)
#   ghcr.io/<owner>/yaver:0.3         ← aynı sürümün kısa hali
#   ghcr.io/<owner>/yaver:latest      ← main'in son hali
#   ghcr.io/<owner>/yaver:sha-abc1234 ← her commit
# Sürüm yayınlanınca depoya v0.3.0 git etiketi ve GitHub Release otomatik eklenir.
# Aynı VERSION ile tekrar push edilirse sürüm etiketi EZİLMEZ; yalnız latest ve sha- güncellenir.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yaver

jobs:
  # Hızlı kontroller: arayüz derlemesi, sunucu gömülü DB ile açılıyor, örnek veri yükleniyor, giriş çalışıyor
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
      - name: Arayüz — tip kontrolü ve derleme
        working-directory: frontend
        run: npm ci && npm run build
      - name: Sunucu bağımlılıkları
        working-directory: server
        run: npm ci --omit=dev
      - name: Sunucu açılıyor mu (gömülü DB + şema + örnek veri + giriş testi)
        env:
          DATA_DIR: ${{ runner.temp }}/yaver-data
          PORT: 8080
          STATIC_DIR: ${{ github.workspace }}/frontend/dist
        run: |
          node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8080/api/health && break; sleep 1; done
          TOKEN=$(curl -sf -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
                  -d '{"username":"admin","password":"admin"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          ITEMS=$(curl -sf localhost:8080/api/state -H "Authorization: Bearer $TOKEN" | node -pe 'JSON.parse(require("fs").readFileSync(0)).items.length')
          echo "örnek iş sayısı: $ITEMS"; test "$ITEMS" -gt 0
          curl -sf localhost:8080/ | grep -q '<div id="root">'
      - name: Ajan API uçtan uca testi (sahte LangGraph ajanı ile)
        env:
          DATA_DIR: ${{ runner.temp }}/yaver-agent-data
          PORT: 8081
          YAVER_URL: http://127.0.0.1:8081
          PUBLIC_URL: http://127.0.0.1:8081
          DEMO_FEEDS: "false"
          AGENT_TOKEN: yvr_ci_token_1234567890abcdef
          AGENT_WEBHOOK_URL: http://127.0.0.1:9099/hook
          AGENT_WEBHOOK_SECRET: s3cret
          AGENT_CHAT_URL: http://127.0.0.1:9099/chat
        run: |
          node server/src/index.js > agent-server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8081/api/health && break; sleep 1; done
          node server/test/agent-e2e.mjs
      - name: Sunucu logu
        if: always()
        run: cat server.log agent-server.log || true

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write     # sürüm etiketi + release
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sürüm
        id: ver
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION geçersiz: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          # Bu sürüm daha önce yayınlandıysa (v<VERSION> etiketi varsa) sürüm etiketlerini tekrar basma
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION zaten yayınlanmış; yalnız latest ve sha- etiketleri güncellenecek. Yeni sürüm için VERSION'ı artırın."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: ghcr.io girişi
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true' }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      - name: Derle ve gönder
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PR'da yalnız derlenir
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sürüm etiketi ve GitHub Release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          gh release create "v$V" --target "$GITHUB_SHA" --title "Yaver $V" \
            --notes "Docker imajı: \`$IMG:$V\`" --generate-notes
