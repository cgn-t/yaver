# =====================================================================
# Yaver — TEK POD, TEK KONTEYNER
#   Konteyner: arayüz + API + zamanlanmış API servisi + gömülü veritabanı (PGlite).
#   Ayrı veritabanı sunucusu/konteyneri YOK. Veriler /data klasöründe dosya olarak durur;
#   bu klasör PVC'ye bağlı olduğu için pod yeniden başlasa da veriler kalır.
#   İlk açılışta tablolar oluşturulur (01-schema.sql) ve örnek veri yüklenir (02-seed.sql).
#
# Kurulum:
#   1) İmaj GitHub Actions ile otomatik derlenir: ghcr.io/cgn-t/yaver:<sürüm> (.github/workflows/docker-image.yml)
#      Paket gizliyse (varsayılan) kümeye çekme izni verin:
#        kubectl create namespace yaver
#        kubectl -n yaver create secret docker-registry ghcr-pull --docker-server=ghcr.io \
#          --docker-username=<github-kullanıcı> --docker-password=<read:packages yetkili PAT>
#      Paketi GitHub'da "public" yaptıysanız bu adıma ve aşağıdaki imagePullSecrets'a gerek yok.
#   2) TOKEN_SECRET değerini değiştirin.
#   3) kubectl apply -f deploy/k8s/yaver.yaml
#   4) kubectl -n yaver port-forward svc/yaver 8080:80   →  http://localhost:8080  (admin / admin)
#
# Kalıcı disk istemiyorsanız (deneme): en alttaki "volumes" bölümünde PVC yerine emptyDir kullanın;
# o durumda pod silinince veriler örnek veriye döner.
# Sürümler: github.com/cgn-t/yaver/releases
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: yaver
---
apiVersion: v1
kind: Secret
metadata:
  name: yaver-secrets
  namespace: yaver
type: Opaque
stringData:
  TOKEN_SECRET: "DEGISTIRIN-uzun-rastgele-bir-deger"  # oturum imzalama anahtarı (openssl rand -hex 32)
  # LangGraph ajanının Yaver'e bağlanacağı token (yvr_ ile başlasın, en az 24 karakter): echo yvr_$(openssl rand -hex 24)
  AGENT_TOKEN: "yvr_DEGISTIRIN-ajan-icin-uzun-rastgele-deger"
  AGENT_WEBHOOK_SECRET: "DEGISTIRIN-webhook-imza-anahtari"   # ajan, gelen olayların imzasını bununla doğrular
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yaver-data
  namespace: yaver
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  # storageClassName: standard   # PVC "Pending" kalırsa: kubectl get storageclass → adı buraya yazıp açın
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaver
  namespace: yaver
  labels: { app: yaver }
spec:
  replicas: 1                     # veri dosyası tek pod'a ait: 1'den fazla yapmayın
  strategy:
    type: Recreate                # aynı diski iki pod aynı anda açmasın
  selector:
    matchLabels: { app: yaver }
  template:
    metadata:
      labels: { app: yaver }
    spec:
      imagePullSecrets:
        - name: ghcr-pull         # ghcr.io paketi public ise bu iki satırı silin
      securityContext:
        runAsUser: 1000           # imajdaki "node" kullanıcısı
        runAsGroup: 1000
        fsGroup: 1000             # /data diski bu kullanıcıya yazılabilir olsun
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30   # kapanırken veritabanı dosyaları düzgün kapatılır
      containers:
        - name: yaver
          image: ghcr.io/cgn-t/yaver:0.6.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: yaver-secrets, key: TOKEN_SECRET } }
            - { name: DATA_DIR, value: /data }
            - { name: SEED, value: "true" }          # ilk açılışta örnek veri; boş kurulum için "false"
            - { name: DEMO_FEEDS, value: "true" }    # örnek mail/zoom kaynakları; gerçek entegrasyonda "false"
            - { name: TZ, value: Europe/Istanbul }
            # ---- LangGraph ajanı (docs/AJAN-API.md) ----
            - name: AGENT_TOKEN
              valueFrom: { secretKeyRef: { name: yaver-secrets, key: AGENT_TOKEN } }
            - name: AGENT_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: yaver-secrets, key: AGENT_WEBHOOK_SECRET } }
            - { name: PUBLIC_URL, value: "http://yaver.yaver.svc" }      # ajanın Yaver'e ulaştığı adres
            # Olaylar: AGENT_WEBHOOK_URL verilirse Yaver iter (webhook), verilmezse ajan GET /api/agent/events ile çeker (pull)
            # - { name: AGENT_WEBHOOK_URL, value: "http://yaver-agent.yaver.svc:8000/events" }
            # - { name: AGENT_WEBHOOK_FORMAT, value: "plain" }            # LangGraph Server /runs için: langgraph
            # Chat: AGENT_CHAT_URL verilirse Yaver ajandan SSE ile cevap akıtır; verilmezse chat.message olayı gider
            # - { name: AGENT_CHAT_URL, value: "http://yaver-agent.yaver.svc:8000/chat" }
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: yaver-data }
          # Kalıcı disk yoksa yukarıdaki satırı silip şunu açın:
          # emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: yaver
  namespace: yaver
spec:
  selector: { app: yaver }
  ports:
    - { name: http, port: 80, targetPort: http }
