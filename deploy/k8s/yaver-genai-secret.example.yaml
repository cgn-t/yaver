# GenAI Studio bağlantısı için Secret ŞABLONU — docs/GENAI-ENV.md
# Bu dosyada gerçek değer YOKTUR ve olmamalıdır. Kopyalayıp <...> yerlerini doldurun, repoya EKLEMEYİN:
#   cp deploy/k8s/yaver-genai-secret.example.yaml /tmp/yaver-genai.yaml   # düzenleyin
#   oc apply -f /tmp/yaver-genai.yaml && rm /tmp/yaver-genai.yaml
#   oc -n yaver rollout restart deploy/yaver
# Pod bu Secret'ı deploy/k8s/yaver.yaml içindeki envFrom ile okur (optional: Secret yoksa GenAI kapalı kalır).
apiVersion: v1
kind: Secret
metadata:
  name: yaver-genai
  namespace: yaver
type: Opaque
stringData:
  # --- Zorunlu ---
  GENAI_APPLICATION_BACKEND_URL: "<Chat Block adresi: kök ya da .../chat/block ile biten tam adres>"
  GENAI_SSO_URL: "<SSO adresi: kök ya da .../openid-connect/token ile biten tam token adresi>"
  GENAI_CHAT_CLIENT_ID: "<token isteğindeki client_id>"
  GENAI_CHAT_CLIENT_SECRET: "<token isteğindeki client_secret>"
  GENAI_APP_ID: "<app-id başlığının değeri>"
  GENAI_APP_IDENTIFIER: "<app-identifier başlığının değeri>"
  # --- İsteğe bağlı (yazmazsanız koddaki varsayılan kullanılır) ---
  # GENAI_SSO_REALM: "genai-studio"
  # GENAI_SSO_SCOPE: "openid"            # "none" → scope gönderilmez
  # GENAI_SSO_TOKEN_PATH: "/auth/realms/{realm}/protocol/openid-connect/token"
  # GENAI_SSO_TOKEN_FORMAT: "form"       # form | json
  # GENAI_CHAT_PATH: "/chat/block"
  # GENAI_ENABLED: "true"                # "false" → GenAI tamamen kapalı
  # --- Kurum içi sertifika (SELF_SIGNED_CERT_IN_CHAIN) ---
  # GENAI_CA_CERT: |                     # CA sertifikası (PEM); yalnız GenAI çağrılarında kullanılır
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # GENAI_TLS_INSECURE: "true"           # YALNIZ DEMO: GenAI çağrılarında sertifika doğrulanmaz
