# Yerel deneme: pod'daki konteynerin aynısı.  docker compose up --build  →  http://localhost:8080  (admin / admin)
services:
  yaver:
    build: .
    image: yaver:local
    environment:
      TOKEN_SECRET: yerel-deneme-anahtari
      SEED: "true"
      DEMO_FEEDS: "true"
      TZ: Europe/Istanbul
    volumes: [yaverdata:/data]
    ports: ["8080:8080"]
volumes:
  yaverdata:
